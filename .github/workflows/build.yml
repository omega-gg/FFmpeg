# NOTE: Each job zips deploy/ itself, which keeps the symbolic links that an artifact upload
#       drops. A push to master publishes the five archives as a release named after the
#       version in build.sh, once per version, which 3rdparty downloads without a login
#       (artifacts need one). A manual run on master with 'update' replaces them.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update:
        description: "Replace the archives of the current release (on master)"
        type: boolean
        default: false

jobs:

#--------------------------------------------------------------------------------------------------
# Windows, macOS, iOS, Android
#--------------------------------------------------------------------------------------------------
# NOTE: Windows builds on Linux, with MinGW.

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { platform: win64,   runner: ubuntu-24.04 }
        - { platform: macOS,   runner: macos-14 }
        - { platform: iOS,     runner: macos-14 }
        - { platform: android, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v5
    - run: |
        sh build.sh ${{ matrix.platform }}
        cd deploy
        zip -rqy ../FFmpeg.zip *
    - uses: actions/upload-artifact@v4
      with:
        name: FFmpeg-${{ matrix.platform }}
        path: FFmpeg.zip

#--------------------------------------------------------------------------------------------------
# Linux
#--------------------------------------------------------------------------------------------------
# NOTE: The glibc of Ubuntu 22.04, as Qt 6 requires. The older the glibc, the more distributions
#       run the build.

  linux64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: |
        docker run -d --name ubuntu -v $PWD:/FFmpeg amd64/ubuntu:22.04 tail -f /dev/null
        docker exec -t ubuntu bash -c "set -e;
                                       cd /FFmpeg;
                                       export DEBIAN_FRONTEND=noninteractive;
                                       apt-get update;
                                       apt-get -y install sudo zip;
                                       sh build.sh linux;
                                       cd deploy;
                                       zip -rqy ../FFmpeg.zip *"
    - uses: actions/upload-artifact@v4
      with:
        name: FFmpeg-linux64
        path: FFmpeg.zip

#--------------------------------------------------------------------------------------------------
# Release
#--------------------------------------------------------------------------------------------------

# NOTE: A push publishes a version once, a release that exists already is left as it is. Only a
#       manual run with 'update' replaces its archives, and moves its tag to that commit.

  release:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.update)
    needs: [build, linux64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - run: |
        name=$(sed -n 's/^FFmpeg_version="\(.*\)"/\1/p' build.sh)
        build=$(sed -n 's/^FFmpeg_build="\(.*\)"/\1/p' build.sh)
        if [ -n "$build" ]; then
            name="$name-$build"
        fi
        for path in artifacts/FFmpeg-*; do
            mv $path/FFmpeg.zip $(basename $path).zip
        done
        if ! gh release view "$name" > /dev/null 2>&1; then
            gh release create "$name" FFmpeg-*.zip --target "$GITHUB_SHA" --title "$name"
        elif [ "$UPDATE" = "true" ]; then
            git tag -f "$name" "$GITHUB_SHA"
            git push -f origin "refs/tags/$name"
            gh release upload "$name" FFmpeg-*.zip --clobber
        else
            echo "$name is published already"
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        UPDATE: ${{ inputs.update }}
